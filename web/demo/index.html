<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Static Boolean full-text search and browser analytics over EUR-LEX">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>EUR-LEX full-text search</title>
  <script>
    (() => {
      let preference = "auto";
      try { preference = localStorage.getItem("eur-lex-theme") || "auto"; } catch {}
      const dark = preference === "dark" || (preference === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>This search page requires JavaScript and WebAssembly.</noscript>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
